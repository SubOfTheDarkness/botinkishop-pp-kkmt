
{% extends "base.html" %}

{% block title %}Вход — Botinki Shop{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-form">
    <h2 style="margin-bottom: 1.5rem;">Вход в Botinki Shop</h2>

    <form method="POST" action="{{ url_for('auth.auth') }}">
        <div class="form-group">
            <label>Логин</label>
            <input
                type="text"
                name="login"
                placeholder="Введите логин"
                required
                autofocus
            >
        </div>

        <button type="submit" class="btn btn-primary"
                style="width:100%;">
            Войти
        </button>
    </form>
</div>
{% endblock %}
